<head>

<title>مواقيت الصلاة والأذكار</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#EEF2EC;--ink:#13302B;--mut:#587069;--sf:#fff;--ln:#D3DDD6;--hl:#E1EEE6;--hero:#1B6355;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A19;--ink:#E4EEE9;--mut:#93ABA4;--sf:#142624;--ln:#244039;--hl:#1B3430;--hero:#175548;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1A19;--ink:#E4EEE9;--mut:#93ABA4;--sf:#142624;--ln:#244039;--hl:#1B3430;--hero:#175548;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 30px/1.3 Amiri,serif;margin:0}
.sub{color:var(--mut);margin:2px 0 16px;font-size:14px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,button{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;min-height:44px}
button{cursor:pointer}
#geo{grid-column:1/-1}
:focus-visible{outline:3px solid #D9A93E;outline-offset:2px}
.hero{background:var(--hero);color:#fff;border-radius:18px;padding:22px 20px 18px;margin:16px 0}
.hero small{opacity:.8;font-size:14px}
#nn{font:700 54px/1.2 Amiri,serif;margin:0}
#nt{font-size:18px;opacity:.9}
#cd{font-size:30px;font-weight:600;color:#F2CF82;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;margin-top:6px}
.tl{position:relative;height:22px;margin:16px 4px 0}
.tl::before{content:"";position:absolute;inset-inline:0;top:50%;height:2px;background:rgba(255,255,255,.3)}
.d,.now{position:absolute;top:50%;border-radius:50%;transform:translate(50%,-50%)}
.d{width:8px;height:8px;background:#F2CF82}
.now{width:16px;height:16px;background:#fff;border:3px solid var(--hero);box-shadow:0 0 0 2px #fff}
ul{list-style:none;margin:0;padding:0;background:var(--sf);border-radius:14px;border:1px solid var(--ln)}
li{display:flex;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--ln)}
li:last-child{border:0}
li.on{background:var(--hl);font-weight:600}
li time{font-variant-numeric:tabular-nums}
.note{color:var(--mut);font-size:13px;margin:10px 2px 0}
h2{font:700 24px Amiri,serif;margin:32px 0 10px}
.dh{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px 20px}
#at{font:400 28px/2.1 Amiri,serif;margin:0}
#as{color:var(--mut);font-size:14px;margin:8px 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
#cnt{min-width:96px;font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
<h1>مواقيت الصلاة</h1>
<p class="sub" id="dt"></p>
<div class="pick">
<select id="co" aria-label="الدولة"></select>
<select id="ct" aria-label="المدينة"></select>
<button id="geo">استخدم موقعي الحالي</button>
</div>
<section class="hero" aria-live="off">
<small>الوقت القادم</small>
<p id="nn">—</p>
<div id="nt"></div>
<div id="cd">00:00:00</div>
<div class="tl" id="tl"></div>
</section>
<ul id="list"></ul>
<p class="note" id="info"></p>

<h2>ذكر اليوم</h2>
<div class="dh">
<p id="at"></p>
<p id="as"></p>
<div class="row"><button id="cnt" aria-label="عدّاد التسبيح">0</button><button id="nx">ذكر آخر</button><button id="rs">تصفير</button></div>
</div>
<p class="note">الأوقات محسوبة فلكيًا على جهازك بدون اتصال بأي خادم. قد تختلف دقيقة أو دقيقتين عن التقويم المحلي، فاعتمد تقويم مسجدك عند الحاجة.</p>
</main>
